apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stage3-logs

resources:
  - ../../base/namespace
  - ../../base/log-producer
  - ../../base/log-processor
  - ../../base/grafana

# 本地 overlay 只使用已旁加载到 stage3-logs 的固定提交镜像。
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/name=log-producer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: log-processor
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: grafana
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/grafana/grafana:13.1.0
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
