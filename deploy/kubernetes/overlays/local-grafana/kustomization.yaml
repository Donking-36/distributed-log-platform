apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stage3-logs

resources:
  - ../../base/namespace
  - ../../base/grafana

# 本地节点使用已旁加载的明确版本；部署入口只检查镜像存在和 Pod 就绪。
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: grafana
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/grafana/grafana:13.1.0
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
