apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stage3-logs

resources:
  - ../../base/namespace
  - ../../base/grafana

# 本地节点使用已旁加载的固定标签；Make 门禁负责核对标签背后的实际镜像身份。
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: grafana
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/grafana/grafana:13.1.0
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
