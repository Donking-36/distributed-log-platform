apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stage3-logs

resources:
  - ../../base/namespace
  - ../../base/elasticsearch

# Minikube 节点只运行已经旁加载并核验过的 linux/amd64 镜像。
images:
  - name: docker.io/library/elasticsearch
    newName: docker.io/library/elasticsearch
    newTag: 9.4.4

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: elasticsearch
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: elasticsearch
      spec:
        template:
          metadata:
            annotations:
              distributed-log-platform.io/security-mode: disabled-local-development-only
              distributed-log-platform.io/upstream-index-digest: sha256:7de2137b43d9f263cffe51f139a9f3144da7b9941de615fb4317fc539f4d16a7
              distributed-log-platform.io/upstream-amd64-digest: sha256:c060ba28f5cfea4eedd8fb85bd5f6bf7d120e53040ee038a289c28979af7128c
              distributed-log-platform.io/local-import-digest: sha256:d98bb271b34aaa8cb2d989673653eb275aa474cfa7f649c7665b845ce66b7677
              distributed-log-platform.io/expected-config-digest: sha256:d3e5c642b3f9082731ab9e3a5d5d659728b29627ed806bf5fec20995a6077640
          spec:
            initContainers:
              - name: prepare-config
                imagePullPolicy: Never
            containers:
              - name: elasticsearch
                imagePullPolicy: Never
                env:
                  # 关闭认证和 TLS 仅适用于隔离的本地 Minikube；Service 不得对外暴露。
                  - name: ES_SETTING_XPACK_SECURITY_ENABLED
                    value: "false"
                  - name: ES_SETTING_XPACK_SECURITY_AUTOCONFIGURATION_ENABLED
                    value: "false"
                  # Restricted 命名空间不使用特权 initContainer 修改宿主 sysctl。
                  - name: ES_SETTING_NODE_STORE_ALLOW__MMAP
                    value: "false"
