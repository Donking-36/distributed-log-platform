apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stage3-logs

resources:
  - ../../base/namespace
  - ../../base/elasticsearch

# Minikube 节点只运行已经旁加载的 Elasticsearch 9.4.4 镜像。
images:
  - name: docker.io/library/elasticsearch
    newName: docker.io/library/elasticsearch
    newTag: 9.4.4

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: elasticsearch
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: elasticsearch
      spec:
        template:
          metadata:
            annotations:
              distributed-log-platform.io/security-mode: disabled-local-development-only
          spec:
            initContainers:
              - name: prepare-config
                imagePullPolicy: Never
            containers:
              - name: elasticsearch
                imagePullPolicy: Never
                env:
                  # 关闭认证和 TLS 仅适用于隔离的本地 Minikube；Service 不得对外暴露。
                  - name: ES_SETTING_XPACK_SECURITY_ENABLED
                    value: "false"
                  - name: ES_SETTING_XPACK_SECURITY_AUTOCONFIGURATION_ENABLED
                    value: "false"
                  # Restricted 命名空间不使用特权 initContainer 修改宿主 sysctl。
                  - name: ES_SETTING_NODE_STORE_ALLOW__MMAP
                    value: "false"
