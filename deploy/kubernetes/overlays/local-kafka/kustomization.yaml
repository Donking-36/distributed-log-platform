apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stage3-logs

resources:
  - ../../base/namespace
  - ../../base/kafka

# 主容器与初始化容器使用同一个明确版本的本地旁加载镜像。
images:
  - name: apache/kafka
    newName: apache/kafka
    newTag: 4.3.1

# Minikube 节点只运行已旁加载的 Kafka 4.3.1 镜像。
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: kafka
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: kafka
      spec:
        template:
          spec:
            initContainers:
              - name: prepare-config
                imagePullPolicy: Never
            containers:
              - name: kafka
                imagePullPolicy: Never
