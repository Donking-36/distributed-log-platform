apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-initializer
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: topic-initializer
    app.kubernetes.io/part-of: distributed-log-platform
    distributed-log-platform.io/purpose: topic-initialization
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/instance: kafka
        app.kubernetes.io/component: topic-initializer
        app.kubernetes.io/part-of: distributed-log-platform
        distributed-log-platform.io/purpose: topic-initialization
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-topic-initializer
          image: apache/kafka:unconfigured
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/stage3/topic-initializer/initialize-topics.sh
          env:
            - name: BOOTSTRAP_SERVER
              value: kafka:9092
            - name: KAFKA_HEAP_OPTS
              value: -Xms32m -Xmx128m
            - name: KAFKA_GC_LOG_OPTS
              value: ""
            - name: LOG_DIR
              value: /tmp/kafka-logs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: initializer-script
              mountPath: /opt/stage3/topic-initializer
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: initializer-script
          configMap:
            name: kafka-topic-initializer
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
