apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: distributed-log-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
  ports:
    # 业务客户端只通过这个稳定入口访问 Broker。
    - name: client
      protocol: TCP
      port: 9092
      targetPort: client
