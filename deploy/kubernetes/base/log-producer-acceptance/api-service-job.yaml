apiVersion: batch/v1
kind: Job
metadata:
  name: api-service-acceptance
  labels:
    app.kubernetes.io/name: log-producer
    app.kubernetes.io/instance: api-service-acceptance
    app.kubernetes.io/component: log-source
    app.kubernetes.io/part-of: distributed-log-platform
    distributed-log-platform.io/purpose: acceptance
spec:
  completions: 1
  parallelism: 1
  # 验收失败时不自动生成第二批日志，保证输出数量的故障边界清晰。
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-producer
        app.kubernetes.io/instance: api-service-acceptance
        app.kubernetes.io/component: log-source
        app.kubernetes.io/part-of: distributed-log-platform
        distributed-log-platform.io/purpose: acceptance
        # service 是日志身份和后续 Filebeat 路由的权威来源。
        service: api-service
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: log-producer
          image: distributed-log-platform/log-producer:unconfigured
          imagePullPolicy: IfNotPresent
          env:
            # Downward API 保证进程配置与受控 Pod 标签一致。
            - name: PRODUCER_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['service']
            - name: PRODUCER_COUNT
              value: "20"
            - name: PRODUCER_INTERVAL
              value: 50ms
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
